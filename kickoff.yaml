version: 1
workflow:
  mode: auto
  primary_models:
    claude: opus
    codex: sol
  eligible_primary_models:
    - opus
    - sol
    - fable
    - astra
  review_preference: cross-vendor
  adviser_models:
    claude:
      reviewer:
        - sol
      critic:
        - sol
    codex:
      reviewer:
        - opus
      critic:
        - opus
  allowed_harnesses:
    - claude
    - codex
  targets: {}
role_models:
  default:
    planner:
      model: default
    reviewer:
      model: default
    coder:
      model: default
    critic:
      model: default
  claude:
    planner:
      model: opus
      effort: high
    reviewer:
      model: opus
      effort: high
    coder:
      model: opus
      effort: high
    critic:
      model: opus
      effort: high
  codex:
