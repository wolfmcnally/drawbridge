schema: agentic.proof_estate.v5
baseline_report: reports/test-governance/drawbridge-baseline.json
audit_ledger: reports/test-governance/drawbridge-decisions.jsonl
witness_ledger: reports/test-governance/drawbridge-witnesses.jsonl
adoption:
  mode: bounded
  reason: Preserve the full initial product/imported estate. No whole-estate re-witness
    or deletion; actual adapted/new assertions receive local authoring qualification
    in bounded affected-contract batches before completion.
hang_timeout_seconds: 1800
mutation:
  tool: null
  reason: No bulk mutation survey requested; focused authoring witnesses are separate.
critical_risks:
  corruption:
    state: applicable
    direct_proof: pytest:tests/test_check_receipt.py::test_tampered_log_never_reuses_receipt
  public-contract:
    state: applicable
    direct_proof: pytest:tests/test_vellric.py::test_pdf_citation_contract_refuses[wrong-digest]
  schema:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_config.py::test_invalid_edit_is_atomic
  security:
    state: applicable
    direct_proof: pytest:tests/test_documentation.py::test_curated_source_refuses_escape_and_private_inputs
  cleanup:
    state: applicable
    direct_proof: pytest:tests/test_test_governance.py::test_outstanding_child_makes_completed_leader_incomplete[0]
  deploy:
    state: not-applicable
    rationale: No live deployment workflow or hosting integration is adopted by this
      transfer.
    activation_trigger: An explicitly approved live deployment surface is added.
  custody:
    state: applicable
    direct_proof: pytest:tests/test_multioperator.py::test_transition_and_maintenance_refuse_false_state
  authority:
    state: applicable
    direct_proof: pytest:tests/test_multioperator.py::test_transition_and_maintenance_refuse_false_state
  concurrency:
    state: applicable
    direct_proof: pytest:tests/test_multioperator.py::test_transition_and_maintenance_refuse_false_state
  atomicity:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_config.py::test_invalid_edit_is_atomic
  recovery:
    state: applicable
    direct_proof: pytest:tests/test_test_governance.py::test_governance_allows_nested_supervisor_cleanup
  credentials:
    state: applicable
    direct_proof: pytest:tests/test_drawbridge_methodology_adoption.py::test_real_test_entrypoint_scrubs_parent_secrets_and_home
  core-success:
    state: applicable
    direct_proof: pytest:tests/test_check.py::test_all_is_default_locked_ordered_and_cwd_independent
witness_failure_lines: '^E '
