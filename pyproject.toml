[project]
name = "drawbridge"
version = "0.1.0"
description = "Any file in, one Markdown mirror out: content-based identification, deterministic local conversion, fail-closed inspection, provenance-headed output."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{ name = "Wolf McNally", email = "wolf@wolfmcnally.com" }]
keywords = ["pdf", "markdown", "ocr", "tesseract", "vellric", "pillow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Environment :: Console",
]
dependencies = [
  "olefile>=0.47",
  "openpyxl>=3.1.5",
  "pillow>=11.3,<13",
  "pyyaml>=6.0",
  "xlrd>=2.0.2",
]

[project.optional-dependencies]
audio = ["quillric>=0.1.0"]

[project.scripts]
drawbridge = "drawbridge.cli:main"

[project.urls]
Homepage = "https://github.com/wolfmcnally/drawbridge"

[dependency-groups]
dev = [
  "pymupdf==1.28.2", # Development-only fixture authoring and native lock proofs; never installed by the MIT runtime.
  "pytest>=8.3",
  "quillric>=0.1.0",
]

[tool.uv.sources]
quillric = { git = "https://github.com/wolfmcnally/quillric.git", rev = "c48b76e522f4e677df9184a2e82469ddcdb9cee9" }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires ocrmypdf and tesseract on PATH and runs real OCR",
]
addopts = "-ra"

[tool.hatch.build.targets.sdist]
# Hatchling writes canonical metadata; do not re-add the extracted copy.
exclude = ["/PKG-INFO"]
