[book]
title = "Drawbridge Manual"
authors = ["Wolf McNally"]
description = "Local document conversion, provenance and truthful extraction boundaries."
language = "en"
src = "src"

[build]
build-dir = "../.kickoff/manual"
create-missing = false

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.3"
on_failure = "bail"

[output.html]
site-url = "/"
additional-css = ["mdbook-admonish.css"]

[output.html.playground]
runnable = false

[output.html.search]
enable = true

[output.html.print]
enable = true
